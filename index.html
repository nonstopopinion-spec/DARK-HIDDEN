<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM DARK | Secure Vault</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
 --green:#00ff66;
 --dark:#020805;
 --panel:#07150d;
 --border:#075c2b;
}

body{
 background:var(--dark);
 color:var(--green);
 font-family:monospace;
 min-height:100vh;
 overflow-x:hidden;
}

canvas{
 position:fixed;
 inset:0;
 z-index:-1;
 opacity:.24;
}

.container{
 width:92%;
 max-width:900px;
 margin:35px auto;
}

header{
 text-align:center;
 padding:30px 10px;
}

header h1{
 font-size:42px;
 letter-spacing:8px;
 text-shadow:0 0 10px var(--green),0 0 30px var(--green);
}

header p{
 margin-top:12px;
 letter-spacing:4px;
 color:#83ffa9;
 font-size:12px;
}

.line{
 height:1px;
 background:linear-gradient(90deg,transparent,var(--green),transparent);
 margin:20px 0;
}

.card{
 background:rgba(3,19,9,.94);
 border:1px solid var(--border);
 border-radius:12px;
 padding:25px;
 margin-bottom:22px;
 box-shadow:0 0 20px #00ff6610;
}

.card h2{
 font-size:17px;
 letter-spacing:2px;
 margin-bottom:20px;
}

input{
 width:100%;
 padding:14px;
 margin:9px 0;
 background:#020b05;
 border:1px solid #126b35;
 color:var(--green);
 border-radius:6px;
 outline:none;
 font-family:monospace;
}

input:focus{
 border-color:var(--green);
 box-shadow:0 0 10px #00ff6640;
}

button{
 padding:13px 17px;
 background:var(--green);
 border:1px solid var(--green);
 border-radius:5px;
 color:#001b08;
 font-weight:bold;
 font-family:monospace;
 cursor:pointer;
 transition:.2s;
}

button:hover{
 box-shadow:0 0 18px var(--green);
 background:#aaffc4;
}

.full{width:100%;margin-top:12px}

.outline{
 background:transparent;
 color:var(--green);
}

.small{
 color:#83b99a;
 font-size:12px;
 margin-top:12px;
}

.status{
 margin-top:12px;
 font-size:13px;
 color:#aaffc4;
 overflow-wrap:anywhere;
}

.hidden{display:none!important}

.file{
 display:flex;
 align-items:center;
 justify-content:space-between;
 flex-wrap:wrap;
 gap:12px;
 padding:15px 0;
 border-bottom:1px solid #124327;
}

.file-name{
 max-width:100%;
 overflow-wrap:anywhere;
}

.actions{
 display:flex;
 gap:8px;
}

.actions button{
 padding:9px 12px;
 font-size:11px;
}

.delete{
 background:#240707;
 color:#ff7777;
 border-color:#a52a2a;
}

footer{
 text-align:center;
 padding:30px 10px;
 color:#477b59;
 font-size:11px;
 letter-spacing:2px;
}

.online{
 color:var(--green);
 text-shadow:0 0 8px var(--green);
}

@media(max-width:500px){
 header h1{font-size:30px;letter-spacing:5px}
 .card{padding:18px}
 .file{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

<header>
<h1>TEAM DARK</h1>
<p>◈ SECURE DIGITAL VAULT ◈</p>
<div class="line"></div>
<p class="online">● SYSTEM ONLINE</p>
</header>

<!-- LOGIN -->

<section class="card" id="loginBox">

<h2>▣ ADMIN AUTHENTICATION</h2>

<input id="email" type="email"
placeholder="ADMIN EMAIL">

<input id="password" type="password"
placeholder="ADMIN PASSWORD">

<button class="full" onclick="login()">
[ ACCESS SYSTEM ]
</button>

<p class="status" id="loginStatus"></p>

<p class="small">
AUTHORIZED ADMINISTRATORS ONLY
</p>

</section>

<!-- DASHBOARD -->

<section id="dashboard" class="hidden">

<div class="card">

<h2>◈ ADMIN CONTROL PANEL</h2>

<p class="small">STATUS: <span class="online">CONNECTED</span></p>

<p class="small" id="adminInfo"></p>

<button class="outline full" onclick="logout()">
[ LOGOUT ]
</button>

</div>

<!-- UPLOAD -->

<div class="card">

<h2>⬆ FILE UPLOAD TERMINAL</h2>

<input type="file" id="fileInput">

<button class="full" onclick="uploadFile()">
[ UPLOAD TO VAULT ]
</button>

<p class="status" id="uploadStatus"></p>

</div>

<!-- FILE LIST -->

<div class="card">

<h2>▣ PRIVATE FILE DATABASE</h2>

<button class="outline full" onclick="loadFiles()">
[ REFRESH DATABASE ]
</button>

<div id="fileList">
<p class="small">Initializing database...</p>
</div>

<p class="status" id="fileStatus"></p>

</div>

</section>

<footer>
TEAM DARK © 2026<br><br>
SECURE ACCESS • PRIVATE STORAGE • ADMIN CONTROL
</footer>

</div>

<script>

// =================================
// SUPABASE CONFIGURATION
// =================================

const SUPABASE_URL =
"https://vomyvokxttxyvytyyycm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_64dX9Y92JxUE8bmenbf_9g_cMbwflZh";

const BUCKET = "team-dark-vault";

const ADMIN_UID =
"15966c28-3189-4269-bcbc-d2e16627cf5d";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

// =================================
// LOGIN
// =================================

async function login(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

const status = document.getElementById("loginStatus");

if(!email || !password){
status.textContent = "Enter email and password.";
return;
}

status.textContent = "Authenticating...";

const {data,error} = await db.auth.signInWithPassword({
email,
password
});

if(error){
status.textContent = error.message;
return;
}

if(data.user.id !== ADMIN_UID){
await db.auth.signOut();
status.textContent = "ACCESS DENIED";
return;
}

showDashboard(data.user);

}

// =================================
// DASHBOARD
// =================================

function showDashboard(user){

document.getElementById("loginBox").classList.add("hidden");

document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("adminInfo").textContent =
"ADMIN UID: " + user.id;

loadFiles();

}

// =================================
// SESSION CHECK
// =================================

async function checkSession(){

const {data,error} = await db.auth.getSession();

if(error || !data.session) return;

if(data.session.user.id !== ADMIN_UID){
await db.auth.signOut();
return;
}

showDashboard(data.session.user);

}

// =================================
// UPLOAD FILE
// =================================

async function uploadFile(){

const input = document.getElementById("fileInput");

const file = input.files[0];

const status = document.getElementById("uploadStatus");

if(!file){
status.textContent = "Select a file first.";
return;
}

status.textContent = "Uploading...";

const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

const path = Date.now() + "-" + safeName;

const {error} = await db.storage
.from(BUCKET)
.upload(path,file,{upsert:false});

if(error){
status.textContent = "Upload failed: " + error.message;
return;
}

status.textContent = "UPLOAD SUCCESSFUL";

input.value = "";

loadFiles();

}

// =================================
// LOAD FILES
// =================================

async function loadFiles(){

const list = document.getElementById("fileList");

list.replaceChildren();

const {data,error} = await db.storage
.from(BUCKET)
.list("",{
limit:100,
sortBy:{column:"name",order:"desc"}
});

if(error){
list.textContent = "Unable to load files: " + error.message;
return;
}

const files = (data || []).filter(file => file.name);

if(files.length === 0){
list.textContent = "Vault is empty.";
return;
}

files.forEach(file => {

const row = document.createElement("div");
row.className = "file";

const name = document.createElement("span");
name.className = "file-name";
name.textContent = "▣ " + file.name;

const actions = document.createElement("div");
actions.className = "actions";

const download = document.createElement("button");
download.textContent = "DOWNLOAD";
download.onclick = () => downloadFile(file.name);

const remove = document.createElement("button");
remove.textContent = "DELETE";
remove.className = "delete";
remove.onclick = () => deleteFile(file.name);

actions.append(download,remove);
row.append(name,actions);
list.append(row);

});

}

// =================================
// DOWNLOAD
// =================================

async function downloadFile(name){

const status = document.getElementById("fileStatus");

status.textContent = "Preparing download...";

const {data,error} = await db.storage
.from(BUCKET)
.download(name);

if(error){
status.textContent = error.message;
return;
}

const url = URL.createObjectURL(data);

const a = document.createElement("a");
a.href = url;
a.download = name;
a.click();

URL.revokeObjectURL(url);

status.textContent = "Download started.";

}

// =================================
// DELETE
// =================================

async function deleteFile(name){

if(!confirm("Delete this file permanently?")) return;

const status = document.getElementById("fileStatus");

status.textContent = "Deleting...";

const {error} = await db.storage
.from(BUCKET)
.remove([name]);

if(error){
status.textContent = error.message;
return;
}

status.textContent = "File deleted.";

loadFiles();

}

// =================================
// LOGOUT
// =================================

async function logout(){

await db.auth.signOut();

document.getElementById("dashboard").classList.add("hidden");

document.getElementById("loginBox").classList.remove("hidden");

document.getElementById("password").value = "";

document.getElementById("loginStatus").textContent = "Logged out.";

}

// =================================
// MATRIX BACKGROUND
// =================================

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let drops = [];

function setupMatrix(){

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const columns = Math.floor(canvas.width/18);

drops = Array(columns).fill(1);

}

function drawMatrix(){

ctx.fillStyle = "rgba(2,8,5,0.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "#00ff66";
ctx.font = "15px monospace";

drops.forEach((y,i)=>{

const text = Math.random() > .5 ? "1" : "0";

ctx.fillText(text,i*18,y*18);

if(y*18 > canvas.height && Math.random() > .975){
drops[i] = 0;
}

drops[i]++;

});

}

window.addEventListener("resize",setupMatrix);

setupMatrix();
setInterval(drawMatrix,45);

// START

checkSession();

</script>

</body>
</html>
