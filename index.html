<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM DARK | Official</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: #fff;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

canvas {
    position: fixed;
    inset: 0;
    opacity: 0.25;
    z-index: -1;
}

.container {
    width: 90%;
    max-width: 650px;
    padding: 40px 25px;
    text-align: center;
    border: 1px solid #333;
    background: rgba(10,10,10,0.92);
    box-shadow: 0 0 35px rgba(255,0,0,0.12);
    border-radius: 12px;
}

.logo {
    font-size: 55px;
    color: #ff2525;
    text-shadow: 0 0 20px red;
    margin-bottom: 15px;
}

h1 {
    font-size: 32px;
    letter-spacing: 5px;
    color: #fff;
    text-shadow: 0 0 15px red;
}

.subtitle {
    color: #ff3333;
    letter-spacing: 3px;
    margin-top: 12px;
    font-size: 12px;
}

.line {
    width: 80%;
    height: 1px;
    background: #ff2222;
    margin: 25px auto;
    box-shadow: 0 0 10px red;
}

.description {
    color: #aaa;
    line-height: 1.8;
    font-size: 14px;
}

.info {
    margin-top: 30px;
    padding: 18px;
    border: 1px solid #292929;
    background: #0d0d0d;
    text-align: left;
}

.info p {
    margin: 13px 0;
    color: #ccc;
    font-size: 14px;
}

.info span {
    color: #ff3333;
}

.footer {
    margin-top: 30px;
    color: #666;
    font-size: 11px;
    letter-spacing: 2px;
}

.status {
    color: #00ff88;
    font-size: 12px;
    margin-top: 20px;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

    <div class="logo">⛧</div>

    <h1>TEAM DARK</h1>

    <div class="subtitle">
        WELCOME TO TEAM DARK
    </div>

    <div class="line"></div>

    <p class="description">
        We comply with Telegram policies and
        work for the welfare of Telegram users.
        <br><br>
        CYBER • TECHNOLOGY • SECURITY
    </p>

    <div class="info">
        <p><span>⌖ TARGET</span> : HIDDEN</p>
        <p><span>⌖ AIM</span> : HIDDEN</p>
        <p><span>⌖ TEAM</span> : DARK</p>
        <p><span>⌖ STATUS</span> : ACTIVE</p>
    </div>

    <div class="status">
        ● SYSTEM ONLINE
    </div>

    <div class="footer">
        SILENT MINDS • DARK VISION
        <br><br>
        © 2026 TEAM DARK
    </div>

</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const letters = "01TEAM DARK CYBER SECURITY";
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff2222";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];

        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(draw, 45);
</script>

</body>
</html>
